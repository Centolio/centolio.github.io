<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heydays</title>
  <style>
    :root { --ink: #000; --soft: #6E6E73; --bg: #F6F7F9; --card: #fff; --accent: #3B6FD8; }
    @media (prefers-color-scheme: dark) { :root { --ink: #fff; --soft: #AEAEB2; --bg: #000; --card: #1C1C1E; --accent: #8DB4FF; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
    .brand { font-style: italic; font-weight: 500; font-size: 22px; color: var(--soft); text-decoration: none; }
    h1 { font-style: italic; font-weight: 500; font-size: 34px; margin: 24px 0 4px; }
    .updated { color: var(--soft); font-size: 14px; margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 20px; padding: 8px 24px 16px; }
    h2 { font-size: 19px; font-weight: 600; margin: 24px 0 6px; }
    p { margin: 12px 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>heydays</h1>
    <p class="updated">For the days you look forward to, and the ones you look back on.</p>
    <div class="card">
      <p>Count down to the events you're looking forward to, then keep them as memories with photos and notes.</p>
      <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:centolioapps+heydays@gmail.com">Contact</a></p>
    </div>
  </main>
</body>
</html>
