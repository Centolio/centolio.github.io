<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heydays</title>
  <meta property="og:title" content="Heydays">
  <meta property="og:description" content="Count down to the days you look forward to, then keep them as memories.">
  <!-- People with the app never see this page: the link opens Heydays.
       Everyone else is sent to the App Store. APP_STORE_URL is a
       placeholder until the listing exists
       (https://apps.apple.com/app/id<Apple ID>). -->
  <meta http-equiv="refresh" content="0; url=APP_STORE_URL">
  <style>
    :root { --ink: #000; --soft: #6E6E73; --bg: #F6F7F9; --accent: #3B6FD8; }
    @media (prefers-color-scheme: dark) { :root { --ink: #fff; --soft: #AEAEB2; --bg: #000; --accent: #8DB4FF; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-style: italic; font-weight: 500; font-size: 34px; margin: 0 0 8px; }
    p { color: var(--soft); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>heydays</h1>
    <p>Count down to the days you look forward to, then keep them as memories.</p>
    <p><a href="APP_STORE_URL">Get Heydays on the App Store</a></p>
  </main>
</body>
</html>
