<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centolio</title>
  <style>
    :root { --ink: #000; --soft: #6E6E73; --bg: #F6F7F9; --card: #fff; --accent: #3B6FD8; }
    @media (prefers-color-scheme: dark) { :root { --ink: #fff; --soft: #AEAEB2; --bg: #000; --card: #1C1C1E; --accent: #8DB4FF; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-weight: 600; font-size: 34px; margin: 0 0 4px; }
    .sub { color: var(--soft); margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 20px; padding: 8px 24px 16px; margin-bottom: 16px; }
    h2 { font-style: italic; font-weight: 500; font-size: 24px; margin: 16px 0 4px; }
    p { margin: 12px 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Centolio</h1>
    <p class="sub">Apps for iPhone.</p>
    <div class="card">
      <h2>heydays</h2>
      <p>For the days you look forward to, and the ones you look back on.</p>
      <p><a href="heydays/">About</a> · <a href="heydays/privacy.html">Privacy policy</a></p>
    </div>
    <p class="sub"><a href="mailto:centolioapps@gmail.com">centolioapps@gmail.com</a></p>
  </main>
</body>
</html>
